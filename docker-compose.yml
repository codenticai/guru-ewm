# ─────────────────────────────────────────────────────────────────────────────
# Guru-EWM — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Core services (all sources live in this repository):
#   ipfs               — Content-addressed storage (ipfs/kubo)
#   deepseek-ocr       — OCR inference (FastAPI :9093, Tesseract CPU)
#   medical-diagnostic — Clinical diagnosis service (FastAPI :9094)
#   nlp-model          — NanoLM English NLP model (FastAPI :9095)
#   ewm-gateway        — Central API gateway (FastAPI :8001)
#   ewm-ui             — Generic UI (NiceGUI :8080)
#
# Optional services (external sources, NOT required to run the app):
#   hllset-next        — HLLSet algebra API (Rust :9090)
#   hllset-cortex      — HLLSet semantic compressor (Flask :9092)
#   → enable via:  docker compose -f docker-compose.yml -f docker-compose.optional.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # IPFS — Content-Addressed Storage
  # ═══════════════════════════════════════════════════════════════════════════
  ipfs:
    image: ipfs/kubo:latest
    container_name: ewm-ipfs
    ports:
      - "${IPFS_API_PORT:-5001}:5001"
      - "${IPFS_GATEWAY_PORT:-8081}:8080"
    environment:
      - IPFS_PROFILE=${IPFS_PROFILE:-server}
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - ewm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  # deepseek-ocr — OCR Model Service (Tesseract, CPU-only)
  # ═══════════════════════════════════════════════════════════════════════════
  deepseek-ocr:
    build:
      context: ./deepseek-ocr
      dockerfile: Dockerfile
    container_name: ewm-deepseek-ocr
    ports:
      - "${DEEPSEEK_OCR_PORT:-9093}:9093"
    environment:
      - HLLSET_CORTEX_URL=http://hllset-cortex:9092
      - IPFS_API_URL=http://ipfs:5001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ipfs:
        condition: service_healthy
    networks:
      - ewm-net
    restart: unless-stopped
    # GPU support — enable by setting DEEPSEEK_OCR_GPU_ENABLED=true in .env
    # Requires: nvidia-container-toolkit installed on host
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # medical-diagnostic — Clinical Diagnosis Service (EWM backend)
  # ═══════════════════════════════════════════════════════════════════════════
  medical-diagnostic:
    build:
      context: ./medical-diagnostic
      dockerfile: Dockerfile
    container_name: ewm-medical-diagnostic
    ports:
      - "${MEDICAL_DIAGNOSTIC_PORT:-9094}:9094"
    environment:
      - IPFS_API_URL=http://ipfs:5001
      - HLLSET_NEXT_URL=http://hllset-next:9090
      - DEEPSEEK_OCR_URL=http://deepseek-ocr:9093
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VISION_MODEL=${VISION_MODEL:-hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224}
    volumes:
      - medical_data:/app/data
      - hf_model_cache:/root/.cache/huggingface
    depends_on:
      ipfs:
        condition: service_healthy
      deepseek-ocr:
        condition: service_started
    networks:
      - ewm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  # nlp-model — NanoLM English NLP Model
  # ═══════════════════════════════════════════════════════════════════════════
  nlp-model:
    build:
      context: ./nlp-model
      dockerfile: Dockerfile
    container_name: ewm-nlp-model
    ports:
      - "${NLP_MODEL_PORT:-9095}:9095"
    environment:
      - HLLSET_NEXT_URL=http://hllset-next:9090
      - IPFS_API_URL=http://ipfs:5001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - nlp_data:/app/data
    depends_on:
      ipfs:
        condition: service_healthy
    networks:
      - ewm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9095/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  # ewm-gateway — FastAPI Central Gateway
  # ═══════════════════════════════════════════════════════════════════════════
  ewm-gateway:
    build:
      context: ./ewm-gateway
      dockerfile: Dockerfile
    container_name: ewm-gateway
    ports:
      - "${GATEWAY_PORT:-8001}:8001"
    environment:
      - HLLSET_CORTEX_URL=http://hllset-cortex:9092
      - DEEPSEEK_OCR_URL=http://deepseek-ocr:9093
      - MEDICAL_DIAGNOSTIC_URL=http://medical-diagnostic:9094
      - NLP_MODEL_URL=http://nlp-model:9095
      - IPFS_API_URL=http://ipfs:5001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      deepseek-ocr:
        condition: service_started
      medical-diagnostic:
        condition: service_started
      nlp-model:
        condition: service_started
    networks:
      - ewm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # ewm-ui — NiceGUI Frontend
  # ═══════════════════════════════════════════════════════════════════════════
  ewm-ui:
    build:
      context: ./ewm-ui
      dockerfile: Dockerfile
    container_name: ewm-ui
    ports:
      - "${UI_PORT:-8080}:8080"
    environment:
      - GATEWAY_URL=http://ewm-gateway:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Opt-in: mount the Docker socket so the UI can show host resource usage.
      # Default (/dev/null) disables it safely. Enable by setting
      # DOCKER_SOCK_MOUNT=/var/run/docker.sock in .env
      # (or //var/run/docker.sock on Docker Desktop Windows).
      - ${DOCKER_SOCK_MOUNT:-/dev/null}:/var/run/docker.sock:ro
    depends_on:
      ewm-gateway:
        condition: service_started
    networks:
      - ewm-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  ewm-net:
    name: ${EWM_NETWORK:-ewm-net}
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  ipfs_data:
    name: ewm-ipfs-data
  medical_data:
    name: ewm-medical-data
  hf_model_cache:
    name: ewm-hf-model-cache
  nlp_data:
    name: ewm-nlp-data
